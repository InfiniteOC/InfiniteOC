name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Windows is not covered: the daemon uses unix sockets and the launcher tests use sh stubs.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Tests that need the pinned upstream source skip themselves when .upstream is absent.
      - run: npm test
