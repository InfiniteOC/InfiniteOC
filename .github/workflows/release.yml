name: release

# Cut a release: git tag vX.Y.Z && git push origin vX.Y.Z
# Each runner builds InfiniteOC from source for its own platform, then
# packages the finished binary + build.json as infiniteoc-<target>.zip and
# attaches it to the GitHub release. install.sh / install.ps1 download that
# asset so the first run is instant; where no asset exists (darwin-x64 has no
# hosted runner) the installer builds from source instead.
# Run it by hand (workflow_dispatch) to build and package every target as a dry
# run: the zips are uploaded as workflow artifacts and nothing is published.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: windows-latest
            target: win32-x64
          - os: windows-11-arm
            target: win32-arm64
          - os: macos-latest
            target: darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version-file: mods/infinitui/.tui/go.mod
          cache-dependency-path: mods/infinitui/.tui/go.sum
      - run: node bin/infiniteoc.mjs setup
      # mods/infinitui: build the Go TUI so release installs need no Go toolchain.
      # A block scalar: as a plain scalar the ": " inside the script made the whole file invalid YAML.
      - run: |
          node -e "import('./mods/infinitui/build.mjs').then((m) => m.ensureBuilt({ modDir: 'mods/infinitui', home: '.' }))"
      - run: node scripts/package-release.mjs --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/infiniteoc-${{ matrix.target }}.zip
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/infiniteoc-*.zip
          generate_release_notes: true
