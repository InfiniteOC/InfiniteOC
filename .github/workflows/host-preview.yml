name: host-preview

# A temporary InfiniteOC web host (`infiniteoc host`) on a GitHub runner, reachable over HTTPS through a
# Cloudflare quick tunnel (random *.trycloudflare.com URL, no account). The URL goes to the run's summary once
# the Start step finishes; the password is never printed. Everything dies with the job; cancel the run to stop
# it early.
#
# Secrets: HOST_PASSWORD (required, 16+ characters) and HOST_OPENCODE_CONFIG (optional: an opencode.json with
# providers and a model; otherwise the free OpenCode model is used).
on:
  push:
    branches: [host-preview]
  workflow_dispatch:
    inputs:
      minutes:
        description: How long to keep it up (max 330)
        default: "60"

permissions:
  contents: read

concurrency:
  group: host-preview
  cancel-in-progress: true

jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check secrets
        env:
          HOST_PASSWORD: ${{ secrets.HOST_PASSWORD }}
        run: |
          if [ "${#HOST_PASSWORD}" -lt 16 ]; then
            echo "::error::Add a repository secret HOST_PASSWORD of 16+ characters (Settings > Secrets and variables > Actions)."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build with the web UI
        run: |
          node -e 'const f="infiniteoc.json",fs=require("fs"),c=JSON.parse(fs.readFileSync(f));c.options={...c.options,webUi:true};fs.writeFileSync(f,JSON.stringify(c,null,2)+"\n")'
          node bin/infiniteoc.mjs host bundle "$RUNNER_TEMP/host"
      - name: Install cloudflared
        run: |
          curl -fsSL -o "$RUNNER_TEMP/cloudflared" https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x "$RUNNER_TEMP/cloudflared"
      - name: Start
        env:
          MINUTES: ${{ inputs.minutes || '60' }}
          HOST_PASSWORD: ${{ secrets.HOST_PASSWORD }}
          HOST_OPENCODE_CONFIG: ${{ secrets.HOST_OPENCODE_CONFIG }}
        run: |
          minutes=$(( MINUTES > 330 ? 330 : MINUTES ))
          config=""
          if [ -n "$HOST_OPENCODE_CONFIG" ]; then
            config="$RUNNER_TEMP/opencode.json"
            (umask 077; printf %s "$HOST_OPENCODE_CONFIG" > "$config")
          fi
          # The agent can run shell commands here: take away the runner's passwordless sudo first.
          sudo rm -f /etc/sudoers.d/runner
          # Loopback only; the tunnel is the one way in. A clean environment keeps runner variables away from the agent.
          env -i PATH="$PATH" HOME="$HOME" LANG=C.UTF-8 HOST=127.0.0.1 PORT=8080 \
            INFINITEOC_HOST_PASSWORD="$HOST_PASSWORD" INFINITEOC_HOST_CONFIG="$config" INFINITEOC_HOST_SECURE_COOKIES=1 \
            timeout "${minutes}m" node "$RUNNER_TEMP/host/host.mjs" > "$RUNNER_TEMP/host.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/host.pid"
          for i in $(seq 120); do curl -s -o /dev/null http://127.0.0.1:8080 && break; sleep 1; done
          curl -s -o /dev/null http://127.0.0.1:8080 || { tail -n 50 "$RUNNER_TEMP/host.log"; exit 1; }
          timeout "${minutes}m" "$RUNNER_TEMP/cloudflared" tunnel --no-autoupdate --url http://127.0.0.1:8080 > "$RUNNER_TEMP/tunnel.log" 2>&1 &
          for i in $(seq 60); do url=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' "$RUNNER_TEMP/tunnel.log" | head -1); [ -n "$url" ] && break; sleep 1; done
          [ -n "$url" ] || { echo "The tunnel did not start"; exit 1; }
          {
            echo "## InfiniteOC host"
            echo "- URL: $url (sign in with your HOST_PASSWORD secret)"
            echo "- Up for about $minutes minutes, until $(date -u -d "+$minutes min" '+%H:%M UTC'). Cancel the run to stop it sooner."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Host is up for $minutes minutes; the URL is in this run's summary."
      # Background processes outlive their step; this one holds the job open while the host runs.
      - name: Keep alive
        run: |
          while kill -0 "$(cat "$RUNNER_TEMP/host.pid")" 2>/dev/null; do sleep 15; done
          tail -n 20 "$RUNNER_TEMP/host.log"
