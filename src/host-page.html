<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>InfiniteOC</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%2316111e'/%3E%3Ctext x='16' y='23' font-size='22' text-anchor='middle' fill='%23c084fc'%3E%E2%88%9E%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/_ioc/app.css">
</head>
<body>
  <header class="bar">
    <a class="brand" href="/_ioc/" id="home"><span class="mark" aria-hidden="true">∞</span> InfiniteOC</a>
    <div id="workbar" class="workbar" hidden>
      <span class="sep" aria-hidden="true">/</span>
      <strong id="current"></strong>
      <span id="sync" class="sync" role="status" aria-live="polite"></span>
    </div>
    <div class="actions">
      <button id="download-current" class="ghost" type="button" hidden>Download</button>
      <button id="back" class="ghost" type="button" hidden>Projects</button>
      <a class="ghost button" href="/_ioc/logout">Sign out</a>
    </div>
  </header>

  <main id="list-view" class="list-view">
    <section class="intro">
      <h1>Your projects</h1>
      <p>Projects are saved in <strong>this browser</strong>. The host only keeps a temporary copy while you work, so download anything you want to keep elsewhere.</p>
      <p id="storage" class="muted"></p>
    </section>
    <section class="toolbar">
      <form id="new-form" class="new-form">
        <label class="visually-hidden" for="new-name">New project name</label>
        <input id="new-name" placeholder="New project name" autocomplete="off" maxlength="60">
        <button class="primary" type="submit">Create</button>
      </form>
      <label class="ghost button file-button">Import a folder<input id="import" type="file" webkitdirectory multiple hidden></label>
    </section>
    <p id="message" class="message" role="alert" hidden></p>
    <ul id="projects" class="projects" aria-label="Projects"></ul>
    <p id="empty" class="empty" hidden>No projects yet. Create one above, or ask the agent to start one; it appears here.</p>
  </main>

  <iframe id="work" class="work" title="InfiniteOC session" hidden></iframe>
  <script src="/_ioc/app.js" type="module"></script>
</body>
</html>
